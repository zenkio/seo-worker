[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-worker"
version = "0.1.0"
description = "A deterministic, site-agnostic SEO crawler and continuous audit worker"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
seo-worker = "seo_worker.cli:main"

[tool.setuptools.packages.find]
include = ["seo_worker*"]
